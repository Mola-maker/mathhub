upstream math_geohub_web {
    server 127.0.0.1:3000;
    keepalive 64;
}

server {
    listen 80;
    server_name _;
    client_max_body_size 160k;

    location = /healthz {
        proxy_pass http://math_geohub_web/api/health;
        proxy_set_header Host $host;
    }

    location /_next/static/ {
        proxy_pass http://math_geohub_web;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
    }

    # Vite fingerprints the MathHub JS/CSS asset names, so these bytes are
    # safe to cache immutably at Nginx and the CDN.
    location /mathhub/assets/ {
        proxy_pass http://math_geohub_web;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_hide_header Cache-Control;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
    }

    # These public assets currently have stable names rather than content
    # hashes. Cache briefly so a replacement does not remain stale for a year.
    location /mathhub/fonts/ {
        proxy_pass http://math_geohub_web;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_hide_header Cache-Control;
        add_header Cache-Control "public, max-age=86400" always;
    }

    location /mathhub/audio/ {
        proxy_pass http://math_geohub_web;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_hide_header Cache-Control;
        add_header Cache-Control "public, max-age=86400" always;
    }

    # The shell selects the current fingerprinted asset graph and must always
    # be revalidated. The public root is internally rewritten to this file.
    location = /mathhub/index.html {
        proxy_pass http://math_geohub_web;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_hide_header Cache-Control;
        add_header Cache-Control "no-cache" always;
    }

    location /api/ {
        proxy_pass http://math_geohub_web;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        add_header Cache-Control "private, no-store" always;
    }

    location = / {
        proxy_pass http://math_geohub_web;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_hide_header Cache-Control;
        add_header Cache-Control "no-cache" always;
    }

    location / {
        proxy_pass http://math_geohub_web;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
